name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Firebase deploy credentials
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
        run: |
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::No Firebase deploy credentials configured."
            echo ""
            echo "Add one of these repository secrets (Settings → Secrets and variables → Actions):"
            echo "  • FIREBASE_SERVICE_ACCOUNT — recommended; paste full service account JSON from Firebase Console"
            echo "  • FIREBASE_TOKEN — fallback; run 'npx firebase-tools login:ci' locally and paste the token"
            echo ""
            echo "See DECAP-CMS-SETUP.md section 5 for service account setup."
            exit 1
          fi
          echo "HAS_SERVICE_ACCOUNT=$HAS_SERVICE_ACCOUNT" >> "$GITHUB_ENV"
          echo "HAS_TOKEN=$HAS_TOKEN" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      # Prefer service account — FirebaseExtended/action-hosting-deploy requires firebaseServiceAccount
      - name: Deploy to Firebase Hosting (service account)
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forge-website-b276c
          channelId: live

      # FIREBASE_TOKEN fallback — action-hosting-deploy no longer accepts firebaseToken;
      # deploy with firebase-tools CLI the same way Forge Academy hosting does.
      - name: Deploy to Firebase Hosting (token)
        if: env.HAS_SERVICE_ACCOUNT != 'true' && env.HAS_TOKEN == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools@13 deploy \
            --only hosting \
            --project forge-website-b276c \
            --non-interactive \
            --token "$FIREBASE_TOKEN"
