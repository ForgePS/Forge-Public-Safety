name: Deploy Forge RMS (scaffold)

# Copy this workflow into the Forge RMS repository when ready.
# Requires FIREBASE_SERVICE_ACCOUNT_RMS secret with RMS Firebase project credentials.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RMS }}

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Build hosting
        run: npm run build

      - name: Deploy hosting, rules, and functions
        run: npx firebase-tools@13 deploy --only hosting,firestore:rules,functions --non-interactive
