name: Deploy Forge Academy

on:
  push:
    branches: [main]
    paths:
      - "forge-academy/**"
      - "packages/forge-ai-builder/**"
      - ".github/workflows/deploy-forge-academy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-academy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-academy/package-lock.json

      - name: Require FIREBASE_TOKEN
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::GitHub secret FIREBASE_TOKEN is not set."
            echo ""
            echo "Run locally (no JSON key needed):"
            echo "  cd forge-academy && npx firebase-tools login:ci"
            echo ""
            echo "Paste the printed token as repo secret FIREBASE_TOKEN, then re-run this workflow."
            echo ""
            echo "Or deploy from your machine: firebase login && npm run deploy"
            exit 1
          fi

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: forge-academy/functions

      - name: Build hosting bundle
        run: npm run build

      - name: Deploy hosting, Firestore rules, and Cloud Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          DEPLOY_ONLY=$(node scripts/firebase-deploy-targets.mjs)
          echo "Deploy targets: $DEPLOY_ONLY"
          npx firebase-tools@13 deploy \
            --only "$DEPLOY_ONLY" \
            --project forge-academy-95f84 \
            --non-interactive \
            --token "$FIREBASE_TOKEN"
