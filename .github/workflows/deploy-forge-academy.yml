name: Deploy Forge Academy

on:
  push:
    branches: [main]
    paths:
      - "forge-academy/**"
      - "packages/forge-ai-builder/**"
      - ".github/workflows/deploy-forge-academy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-academy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-academy/package-lock.json

      - name: Validate Firebase service account secret
        env:
          FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_CREDS" ]; then
            echo "::error::GitHub secret FIREBASE_SERVICE_ACCOUNT is missing or empty."
            echo "Create a service account key for Firebase project forge-academy-95f84 and add the full JSON at:"
            echo "  Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo "See docs/AI_BUILDER_DEPLOY.md for step-by-step setup."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: forge-academy/functions

      - name: Build hosting bundle
        run: npm run build

      - name: Deploy hosting, Firestore rules, and Cloud Functions
        run: npx firebase-tools@13 deploy --only hosting,firestore:rules,functions --project forge-academy-95f84 --non-interactive
